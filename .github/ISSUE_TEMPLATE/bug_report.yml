name: Something broke
description: A conversion failed, gave a wrong result, or the app misbehaved.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more exact you are, the faster this gets fixed.
        Found a security problem? Please don't report it here; see the [security policy](https://github.com/newtonstudios/convert/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get instead? Copy any error message the window showed.
      placeholder: I converted a 2-hour MKV to MP4 (HEVC). The bar reached about half, then the window said…
    validations:
      required: true
  - type: input
    id: from-to
    attributes:
      label: From which format to which?
      placeholder: opus → mp3
    validations:
      required: true
  - type: input
    id: convert-version
    attributes:
      label: Convert version
      description: In the menu bar, Convert → About Convert.
      placeholder: "0.4"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Which kind of Mac?
      options:
        - Apple Silicon (M1 or later)
        - Intel
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: opened-from
    attributes:
      label: How did you start the conversion?
      options:
        - Right-click in Finder (Quick Action)
        - Dragged the file onto the window
        - Command line (--cli)
    validations:
      required: false
  - type: input
    id: tools
    attributes:
      label: ffmpeg version (for audio and video)
      description: Run `ffmpeg -version` in Terminal and paste the first line. Leave empty if it isn't installed or isn't involved.
    validations:
      required: false
  - type: textarea
    id: file
    attributes:
      label: The file
      description: If the file isn't private, drag it in here (zip it first if GitHub refuses the type). A file that fails is the fastest way to a fix. Otherwise, describe it (size, length, where it came from).
    validations:
      required: false
