# Every step runs scripts/check.sh, so `scripts/check.sh` locally checks the same things.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels that PR's older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned so swift-format and the compiler don't change under us. Bump by hand.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  format:
    name: format
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check.sh format

  build-test-smoke:
    name: build-test-smoke
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ffmpeg and webp
        run: brew install ffmpeg webp
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
      - name: Build debug (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run EasterEggs unit tests
        run: swift test -Xswiftc -warnings-as-errors --disable-xctest --filter EasterEggsTests
      - name: Run full unit test suite (2m guard for upstream macos-26 hang)
        continue-on-error: true
        run: perl -e 'alarm 120; exec @ARGV' -- swift test -Xswiftc -warnings-as-errors --disable-xctest
      - name: Build universal release app
        run: |
          ./build.sh
          archs="$(lipo -archs build/Convert.app/Contents/MacOS/Convert)"
          echo "Built archs: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          list="$(build/Convert.app/Contents/MacOS/Convert --cli || true)"
          echo "$list"
          [[ "$list" == *"targets: "*mp3* ]]
      - name: Smoke test
        continue-on-error: true
        run: scripts/check.sh smoke --no-build --strict --out "$RUNNER_TEMP/smoke"
      - name: Package Convert.zip
        run: ditto -c -k --keepParent build/Convert.app build/Convert.zip
      - name: Upload Convert-macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Convert-macOS
          path: build/Convert.zip
          retention-days: 30
